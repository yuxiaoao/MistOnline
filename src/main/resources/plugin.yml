name: MistOnline
version: '1.0.1'
main: net.starryisle.starryonline.StarryOnlinePlugin
api-version: '1.20'
description: Daily and weekly online-time rewards with hourly coins
author: StarryIsle
commands:
  mistonline:
    description: View online reward progress or manage the plugin
    usage: /mistonline [info|reload|reset <player>]
    aliases: [monline]
    permission: mistonline.use
permissions:
  mistonline.use:
    description: View your online reward progress
    default: true
  mistonline.admin:
    description: Reload or reset online reward data
    default: op
